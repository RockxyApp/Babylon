name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  simulator-platform-builds:
    name: Build ${{ matrix.platform }} simulator
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            triple: arm64-apple-ios16.0-simulator
            sdk: iphonesimulator
          - platform: tvOS
            triple: arm64-apple-tvos16.0-simulator
            sdk: appletvsimulator
          - platform: watchOS
            triple: arm64-apple-watchos10.0-simulator
            sdk: watchsimulator

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # immutable commit allowed by repository policy

      - name: Build Swift package for ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
          TRIPLE: ${{ matrix.triple }}
          SDK_NAME: ${{ matrix.sdk }}
        run: >-
          swift build
          --disable-index-store
          --build-path "$RUNNER_TEMP/babylon-${PLATFORM}"
          --triple "$TRIPLE"
          --sdk "$(xcrun --sdk "$SDK_NAME" --show-sdk-path)"

  scheduled-hardening:
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane:
          - strict-concurrency
          - address-sanitizer
          - thread-sanitizer
          - capture-rss

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # immutable commit allowed by repository policy

      - name: Run weekly ${{ matrix.lane }} verification
        env:
          LANE: ${{ matrix.lane }}
          CAPTURE_FILTER: CaptureHardeningTests|CapturePolicyTests|WebSocketCaptureLifecycleTests|WebSocketLoopbackIntegrationTests|BabylonLifecycleTests
        run: |
          case "$LANE" in
            strict-concurrency)
              swift build --disable-index-store --build-path "$RUNNER_TEMP/babylon-strict-concurrency" \
                -Xswiftc -strict-concurrency=complete
              ;;
            address-sanitizer)
              swift test --no-parallel --sanitize=address --filter "$CAPTURE_FILTER"
              ;;
            thread-sanitizer)
              swift test --no-parallel --sanitize=thread --filter "$CAPTURE_FILTER"
              ;;
            capture-rss)
              /usr/bin/time -l swift test --no-parallel --filter "$CAPTURE_FILTER"
              ;;
            *)
              echo "Unknown verification lane: $LANE" >&2
              exit 2
              ;;
          esac

  validate:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # immutable commit allowed by repository policy

      - name: Audit public working tree
        run: ./scripts/public-release-audit.sh

      - name: Check out Rockxy protocol fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # immutable commit allowed by repository policy
        with:
          repository: RockxyApp/Rockxy
          path: rockxy
          persist-credentials: false

      - name: Use matching Rockxy branch for paired repository PRs
        env:
          MATCHING_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SAME_REPOSITORY_PR: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPOSITORY_PR" != "true" ] || [ -z "$MATCHING_BRANCH" ]; then
            echo "Using Rockxy main"
            exit 0
          fi
          git check-ref-format --branch "$MATCHING_BRANCH"
          if git -C rockxy ls-remote --exit-code --heads origin "refs/heads/$MATCHING_BRANCH" >/dev/null; then
            git -C rockxy fetch --no-tags --depth=1 origin "refs/heads/$MATCHING_BRANCH"
            git -C rockxy checkout --detach FETCH_HEAD
            echo "Using matching Rockxy branch $MATCHING_BRANCH"
          else
            echo "No matching Rockxy branch; using main"
          fi

      - name: Validate shared protocol fixture corpus
        run: |
          validator=rockxy/docs/tools/validate_babylon_fixtures.py
          if [ -f "$validator" ]; then
            python3 "$validator" "$GITHUB_WORKSPACE"
          else
            echo "::notice::The selected Rockxy ref has no shared-fixture validator; Babylon fixture decode tests still run below."
          fi

      - name: Install formatting tools
        run: brew install swiftformat swiftlint

      - name: Check formatting
        run: swiftformat --lint Package.swift Babylon BabylonTests

      - name: Run SwiftLint
        run: swiftlint lint --strict Babylon BabylonTests

      - name: Run Swift Package tests
        run: swift test --no-parallel

      - name: Build iOS framework
        run: >-
          xcodebuild
          -project Babylon.xcodeproj
          -scheme Babylon
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS framework (Release)
        run: >-
          xcodebuild
          -project Babylon.xcodeproj
          -scheme Babylon
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/babylon-release"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify Release framework excludes private URLSession hooks
        run: |
          binary="$RUNNER_TEMP/babylon-release/Build/Products/Release-iphoneos/Babylon.framework/Babylon"
          test -f "$binary"
          if nm -a "$binary" | grep -Eq '_swizzleURLSession|_didReceiveResponse:sniff:|_didCompleteWithError:'; then
            echo "Private URLSession hook symbols are present in the Release framework."
            exit 1
          fi
          echo "Release framework contains no private URLSession hook symbols."
